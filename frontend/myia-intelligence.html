<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyIA - Plan Intelligence</title>
  <script src="/js/config.js?v=8.3"></script>
  <script src="/js/markdown-renderer.js?v=6.1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0d0d0d; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    #loading { text-align: center; color: #00ff88; padding: 20px; }
    #chat-container { width: 100%; height: 100vh; background: #0d0d0d; display: none; flex-direction: column; }
    .chat-header { padding: 16px 20px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
    .chat-avatar { width: 48px; height: 48px; border-radius: 50%; background: #00ff88; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; overflow: hidden; flex-shrink: 0; }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header-subtitle { font-size: 0.85rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 75%; padding: 12px 18px; border-radius: 12px; font-size: 1rem; line-height: 1.5; word-wrap: break-word; }
    .message-bot { align-self: flex-start; background: #00ff88; color: #000; border-bottom-left-radius: 4px; }
    .message-user { align-self: flex-end; background: #333333; color: #fff; border-bottom-right-radius: 4px; }
    .typing-indicator { display: flex; gap: 4px; padding: 12px 18px; align-self: flex-start; background: #00ff88; border-radius: 12px; border-bottom-left-radius: 4px; }
    .typing-indicator span { width: 8px; height: 8px; background: #000; border-radius: 50%; animation: typing 1.4s infinite ease-in-out; }
    .typing-indicator span:nth-child(1) { animation-delay: 0s; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    .chat-input { padding: 16px 20px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 12px; }
    .chat-input input { flex: 1; padding: 14px 20px; background: #0d0d0d; border: 1px solid #333; border-radius: 24px; color: #fff; font-size: 1rem; }
    .chat-input input:focus { outline: none; border-color: #00ff88; }
    .chat-input button { width: 52px; height: 52px; border-radius: 50%; background: #00ff88; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #000; transition: background 0.2s; }
    .chat-input button:hover { background: #00cc6a; }
    .chat-input button:active { transform: scale(0.95); }
    .chat-input button:disabled { background: #555; cursor: not-allowed; }
    .theme-light { background: #f5f5f5; }
    .theme-light .chat-header { background: #fff; border-color: #ddd; }
    .theme-light .chat-header-name { color: #000; }
    .theme-light .chat-header-subtitle { color: #666; }
    .theme-light .chat-input { background: #fff; border-color: #ddd; }
    .theme-light .chat-input input { background: #f5f5f5; border-color: #ddd; color: #000; }
    .theme-light .message-bot { background: #e0e0e0; color: #000; }
    .theme-light .message-user { background: #0066cc; color: #fff; }
    .theme-light .typing-indicator { background: #e0e0e0; }
    .theme-light .typing-indicator span { background: #000; }
    
    /* Markdown styles */
    .message-bot strong { font-weight: 700; }
    .message-bot em { font-style: italic; }
    .message-bot code { background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .message-bot pre { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; overflow-x: auto; }
    .message-bot pre code { background: none; padding: 0; }
    .message-bot a { color: inherit; text-decoration: underline; }
    .message-bot img { max-width: 100%; border-radius: 8px; margin: 8px 0; }
    .message-bot ul, .message-bot ol { margin: 8px 0; padding-left: 20px; }
    .message-bot li { margin: 4px 0; }
    .message-bot h1, .message-bot h2, .message-bot h3 { margin: 12px 0 8px 0; }
    .message-bot h1 { font-size: 1.4em; }
    .message-bot h2 { font-size: 1.2em; }
    .message-bot h3 { font-size: 1.1em; }
    
    /* Responsive para tablets */
    @media (max-width: 1024px) {
      #chat-container { max-width: 100%; }
      .message { max-width: 80%; }
    }
    
    /* Responsive para móviles */
    @media (max-width: 768px) {
      #chat-container { max-width: 100%; height: 100vh; }
      .chat-header { padding: 12px 16px; }
      .chat-avatar { width: 40px; height: 40px; font-size: 1.2rem; }
      .chat-header-name { font-size: 1rem; }
      .chat-header-subtitle { font-size: 0.75rem; }
      .chat-messages { padding: 16px; }
      .message { max-width: 85%; padding: 10px 14px; font-size: 0.95rem; }
      .chat-input { padding: 12px 16px; }
      .chat-input input { padding: 12px 16px; font-size: 0.95rem; }
      .chat-input button { width: 44px; height: 44px; font-size: 1.1rem; }
    }
    
    /* Responsive para móviles pequeños */
    @media (max-width: 480px) {
      .chat-header { padding: 10px 12px; }
      .chat-avatar { width: 36px; height: 36px; font-size: 1rem; }
      .chat-header-name { font-size: 0.95rem; }
      .chat-header-subtitle { font-size: 0.7rem; }
      .chat-messages { padding: 12px; gap: 10px; }
      .message { max-width: 90%; padding: 10px 12px; font-size: 0.9rem; }
      .chat-input { padding: 10px 12px; gap: 10px; }
      .chat-input input { padding: 10px 14px; font-size: 0.9rem; }
      .chat-input button { width: 40px; height: 40px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div id="loading"><p>Cargando chat...</p></div>
  <div id="chat-container">
    <div class="chat-header">
      <div class="chat-avatar" id="chatAvatar">🤖</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatBotName">Asistente</div>
        <div class="chat-header-subtitle" id="chatSubtitle">Plan Intelligence</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message message-bot" id="welcomeMessage">¡Hola! ¿En qué puedo ayudarte hoy?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
      <button id="sendButton">➤</button>
    </div>
  </div>
  <script src="/js/myia-chat.js?v=8.6"></script>
</body>
</html>
