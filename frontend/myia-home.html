<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Apps - MyIA Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6.3">
  <script src="js/config.js?v=8.3"></script>
  <style>
    .home-container {
      min-height: 100vh;
      background: var(--bg-main);
      padding: 120px 20px 40px;
      position: relative;
    }

    .home-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .home-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .home-title {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-main);
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    .home-subtitle {
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .btn-create {
      background: var(--green-main);
      color: var(--bg-main);
      padding: 14px 28px;
      border: 1px solid var(--green-main);
      border-radius: var(--border-radius-md);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
    }

    .btn-create:hover {
      background: var(--green-secondary);
      border-color: var(--green-secondary);
      transform: translateY(-1px);
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: var(--spacing-lg);
      margin-top: var(--spacing-xl);
      position: relative;
      z-index: 1;
    }

    .app-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-lg);
      transition: all var(--transition);
    }

    .app-card:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
    }

    .app-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--spacing-md);
    }

    .app-card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      font-family: var(--font-display);
    }

    .app-card-slug {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .app-card-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .app-card-status.active {
      background: rgba(0, 255, 136, 0.2);
      color: var(--green-main);
    }

    .app-card-status.inactive {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
    }

    .app-card-status.pending {
      background: rgba(255, 165, 0, 0.2);
      color: #ffa500;
    }

    .app-card-plan {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--border-radius-sm);
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
    }

    .app-card-ai {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: var(--spacing-lg);
    }

    .app-card-ai-badge {
      padding: 2px 8px;
      background: rgba(99, 102, 241, 0.2);
      border-radius: var(--border-radius-sm);
      color: #6366f1;
      font-size: 0.75rem;
    }

    .app-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .app-card-actions button {
      flex: 1;
      min-width: 80px;
      padding: 10px 16px;
      border: none;
      border-radius: var(--border-radius-md);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
    }

    .app-card-actions .btn-edit {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .app-card-actions .btn-edit:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-light);
    }

    .app-card-actions .btn-view {
      background: var(--green-main);
      color: var(--bg-main);
      border: 1px solid var(--green-main);
    }

    .app-card-actions .btn-view:hover {
      background: var(--green-secondary);
      border-color: var(--green-secondary);
    }

    .app-card-actions .btn-technical {
      background: rgba(99, 102, 241, 0.1);
      color: #6366f1;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .app-card-actions .btn-technical:hover {
      background: rgba(99, 102, 241, 0.2);
    }

    .app-card-actions .btn-delete {
      background: rgba(255, 68, 68, 0.1);
      color: #ff4444;
      border: 1px solid rgba(255, 68, 68, 0.3);
    }

    .app-card-actions .btn-delete:hover {
      background: rgba(255, 68, 68, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      background: var(--bg-secondary);
      border: 1px dashed var(--border);
      border-radius: var(--border-radius-lg);
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      opacity: 0.5;
    }

    .empty-state-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
      font-family: var(--font-display);
    }

    .empty-state-text {
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .back-btn {
      background: transparent;
      color: var(--text-secondary);
      padding: 14px 28px;
      border: 1px solid var(--border);
      border-radius: var(--border-radius-md);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
    }

    .back-btn:hover {
      border-color: var(--green-main);
      color: var(--green-main);
      background: rgba(0, 255, 136, 0.05);
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--green-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="index.html" class="navbar-logo">
        <img src="images/New_Logo_White.png" alt="Crysantem" class="navbar-logo-img">
        <span>CRYSANTEM</span>
      </a>
      <div class="navbar-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="navbar-links">
        <a href="#demo" class="navbar-link">Demos</a>
        <a href="#myia" class="navbar-link" style="color: var(--green-main);">MyIA</a>
        <a href="#planes" class="navbar-link">Planes</a>
        <a href="#portfolio" class="navbar-link">Portfolio</a>
        <a href="#nosotros" class="navbar-link">Nosotros</a>
        <a href="#faq" class="navbar-link">FAQ</a>
        <a href="#contacto" class="navbar-link">Contacto</a>
        <div class="navbar-auth">
          <button id="authBtn" class="navbar-auth-btn">Account</button>
          <div id="authDropdown" class="navbar-dropdown">
            <button id="logoutBtn" class="navbar-dropdown-item navbar-dropdown-logout">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-container">
    <div class="container">
      <div class="home-header">
        <div>
          <h1 class="home-title">Mis Apps</h1>
          <p class="home-subtitle">Gestiona tus páginas y agentes de IA</p>
        </div>
        <div style="display: flex; gap: 12px;">
          <button class="back-btn" id="backBtn">← Volver al inicio</button>
          <button class="btn-create" id="createBtn">+ Crear Nueva Página</button>
        </div>
      </div>

      <div id="appsGrid" class="apps-grid">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Cargando tus apps...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Autenticación -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Iniciar Sesión</h3>
        <button class="modal-close" aria-label="Cerrar modal">×</button>
      </div>
      <form id="authForm"></form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // Cargar apps del usuario
    async function loadUserApps() {
      try {
        // Verificar si hay token en URL (después de OAuth)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenFromUrl = urlParams.get('token');
        const planFromUrl = urlParams.get('plan');
        
        if (tokenFromUrl) {
          localStorage.setItem('authToken', tokenFromUrl);
          // Limpiar URL
          window.history.replaceState({}, '', window.location.pathname);
        }

        // Si viene con un plan de OAuth, guardarlo y redirigir al constructor
        if (planFromUrl) {
          localStorage.setItem('selectedPlan', planFromUrl);
          const planConfig = {
            responde: { aiModel: 'gemini-flash', characterLimit: 50000 },
            asiste: { aiModel: 'gemini-flash', characterLimit: 100000 },
            automatiza: { aiModel: 'gemini-pro', characterLimit: 500000 },
            intelligence: { aiModel: 'gemini-pro', characterLimit: 2000000 }
          };
          localStorage.setItem('planConfig', JSON.stringify(planConfig[planFromUrl]));
          window.location.href = 'myia-builder.html';
          return;
        }

        // Verificar autenticación
        const token = localStorage.getItem('authToken');
        if (!token) {
          showAuthRequired();
          return;
        }

        // Obtener userId del token
        const responseProfile = await fetch('https://crysantem-backend.onrender.com/api/auth/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const profileResult = await responseProfile.json();
        if (!profileResult.user) {
          showAuthRequired();
          return;
        }

        const userId = profileResult.user.id;
        localStorage.setItem('userId', userId);

        const response = await fetch(`https://crysantem-backend.onrender.com/api/myia/user-apps/${userId}`, {
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
          }
        });
        const result = await response.json();

        if (result.success && result.data && result.data.length > 0) {
          renderAppsList(result.data);
        } else {
          showEmptyState();
        }
      } catch (error) {
        console.error('Error loading apps:', error);
        showEmptyState();
      }
    }

    function showAuthRequired() {
      document.getElementById('appsGrid').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h3 class="empty-state-title">Inicia sesión para ver tus apps</h3>
          <p class="empty-state-text">Necesitas estar autenticado con Google para gestionar tus páginas.</p>
          <button class="btn-create" id="authBackBtn">Ir al inicio</button>
        </div>
      `;
      
      document.getElementById('authBackBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    function renderAppsList(apps) {
      const grid = document.getElementById('appsGrid');
      
      // Separar páginas configuradas de páginas sin configurar
      // Una página sin configurar tiene payment_status='paid' pero no tiene business_name/slug reales
      const configuredApps = apps.filter(app => app.business_name && app.slug && app.business_name !== '' && app.slug !== '');
      const unconfiguredApps = apps.filter(app => app.payment_status === 'paid' && (!app.business_name || !app.slug || app.business_name === '' || app.slug === ''));
      
      console.log('Apps totales:', apps.length);
      console.log('Apps configuradas:', configuredApps.length);
      console.log('Apps sin configurar:', unconfiguredApps.length);
      
      let html = '';
      
      // Primero mostrar páginas sin configurar (pagadas pero sin datos)
      if (unconfiguredApps.length > 0) {
        html += unconfiguredApps.map(app => {
          const planName = getPlanName(app.payment_plan || app.plan);
          
          return `
          <div class="app-card" style="border: 2px solid var(--green-main); background: rgba(0, 255, 136, 0.05);">
            <div class="app-card-header">
              <div>
                <h3 class="app-card-title">⚡ Nueva Página Sin Configurar</h3>
                <div class="app-card-slug">Pagado - Plan: ${planName}</div>
              </div>
              <span class="app-card-status active">Pagado</span>
            </div>
            
            <div style="text-align: center; padding: 24px 0;">
              <p style="color: var(--text-secondary); margin-bottom: 20px;">Esta página está pagada pero aún no has configurado el diseño, prompt e integraciones.</p>
              <button class="btn-create" data-app-id="${app.id}" data-action="configure" style="font-size: 1.1rem; padding: 16px 32px;">
                ⚙️ Configurar
              </button>
            </div>
          </div>
          `;
        }).join('');
      }
      
      // Luego mostrar páginas configuradas
      html += configuredApps.map(app => {
        const statusClass = app.is_active ? 'active' : (app.payment_status === 'pending_payment' ? 'pending' : 'inactive');
        const statusText = app.is_active ? 'Activo' : (app.payment_status === 'pending_payment' ? 'Pendiente de pago' : 'Inactivo');
        
        // Mostrar botón de marcar como pagado si tiene subscription_id pero payment_status != paid
        const showMarkPaidButton = app.subscription_id && app.payment_status !== 'paid';
        
        return `
        <div class="app-card">
          <div class="app-card-header">
            <div>
              <h3 class="app-card-title">${app.page_name || app.business_name || 'Sin nombre'}</h3>
              <div class="app-card-slug">crysantem.tech/${app.slug}</div>
            </div>
            <span class="app-card-status ${statusClass}">
              ${statusText}
            </span>
          </div>
          
          <div class="app-card-plan">Plan: ${getPlanName(app.payment_plan || app.plan)}</div>
          
          <div class="app-card-ai">
            <span class="app-card-ai-badge">${getModelName(app.ai_model)}</span>
            <span>${formatCharacters(app.character_usage || 0)} / ${formatCharacters(app.character_limit || 50000)} caracteres</span>
          </div>
          
          ${showMarkPaidButton ? `
            <div style="margin-bottom: 12px; padding: 8px; background: rgba(255, 165, 0, 0.1); border: 1px solid rgba(255, 165, 0, 0.3); border-radius: 8px;">
              <p style="font-size: 0.8rem; color: #ffa500; margin-bottom: 8px;">⚠️ Pagado pero webhook no actualizó estado</p>
              <button class="btn-edit" data-app-id="${app.id}" data-action="mark-paid" style="width: 100%; background: rgba(255, 165, 0, 0.2); color: #ffa500; border-color: rgba(255, 165, 0, 0.4);">Marcar como Pagado</button>
            </div>
          ` : ''}
          
          <div class="app-card-actions">
            <button class="btn-view" data-slug="${app.slug}" data-action="view">Ver Página</button>
            <button class="btn-technical" data-app-id="${app.id}" data-action="technical">Panel</button>
            <button class="btn-edit" data-app-id="${app.id}" data-action="edit">Editar</button>
            <button class="btn-delete" data-app-id="${app.id}" data-action="delete">Eliminar</button>
          </div>
        </div>
      `;
      }).join('');
      
      grid.innerHTML = html;

      // Agregar event listeners a los botones
      grid.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', () => editApp(btn.dataset.appId));
      });

      grid.querySelectorAll('[data-action="view"]').forEach(btn => {
        btn.addEventListener('click', () => viewApp(btn.dataset.slug));
      });

      grid.querySelectorAll('[data-action="technical"]').forEach(btn => {
        btn.addEventListener('click', () => viewTechnicalSummary(btn.dataset.appId));
      });

      grid.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => deleteApp(btn.dataset.appId));
      });

      grid.querySelectorAll('[data-action="mark-paid"]').forEach(btn => {
        btn.addEventListener('click', () => markAsPaid(btn.dataset.appId));
      });

      grid.querySelectorAll('[data-action="configure"]').forEach(btn => {
        btn.addEventListener('click', () => configureApp(btn.dataset.appId));
      });
    }

    function showEmptyState() {
      document.getElementById('appsGrid').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </div>
          <h3 class="empty-state-title">Aún no tienes apps creadas</h3>
          <p class="empty-state-text">Crea tu primera página con agente de IA en minutos.</p>
          <button class="btn-create" id="emptyCreateBtn">+ Crear mi primera app</button>
        </div>
      `;
      
      document.getElementById('emptyCreateBtn').addEventListener('click', startCreationFlow);
    }

    function getPlanName(plan) {
      const plans = {
        'responde': 'Responde',
        'asiste': 'Asiste',
        'automatiza': 'Automatiza',
        'intelligence': 'Crysantem Intelligence'
      };
      return plans[plan] || 'Responde';
    }

    function getModelName(model) {
      const models = {
        'gemini-flash': 'Gemini Flash',
        'gemini-pro': 'Gemini Pro'
      };
      return models[model] || 'Gemini Flash';
    }

    function formatCharacters(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    function startCreationFlow() {
      window.location.href = 'myia-plans.html';
    }

    function editApp(appId) {
      localStorage.setItem('editingAppId', appId);
      window.location.href = `myia-editor.html?pageId=${appId}`;
    }

    function viewApp(slug) {
      window.open(`/api/myia/render/${slug}`, '_blank');
    }

    function viewTechnicalSummary(appId) {
      localStorage.setItem('viewingAppId', appId);
      window.location.href = 'myia-dashboard-page.html';
    }

    async function deleteApp(appId) {
      if (!confirm('¿Estás seguro de que quieres eliminar esta página? Esta acción no se puede deshacer y eliminará todos los datos de la base de datos.')) {
        return;
      }

      try {
        const response = await fetch(`https://crysantem-backend.onrender.com/api/myia/delete/${appId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
          }
        });

        const result = await response.json();

        if (result.success) {
          alert('Página eliminada exitosamente');
          loadUserApps(); // Recargar la lista
        } else {
          alert('Error al eliminar página: ' + result.error);
        }
      } catch (error) {
        console.error('Error deleting app:', error);
        alert('Error al eliminar página');
      }
    }

    async function markAsPaid(appId) {
      if (!confirm('¿Estás seguro de que quieres marcar esta página como pagada? Solo haz esto si ya completaste el pago en Mercado Pago.')) {
        return;
      }

      try {
        const response = await fetch(`https://crysantem-backend.onrender.com/api/myia/mark-as-paid/${appId}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${localStorage.getItem('authToken')}`
          }
        });

        const result = await response.json();

        if (result.success) {
          alert('Página marcada como pagada exitosamente');
          loadUserApps(); // Recargar la lista
        } else {
          alert('Error al marcar como pagada: ' + result.error);
        }
      } catch (error) {
        console.error('Error marking as paid:', error);
        alert('Error al marcar como pagada');
      }
    }

    function configureApp(appId) {
      localStorage.setItem('editingAppId', appId);
      localStorage.setItem('isConfiguringUnpaidPage', 'true');
      window.location.href = 'myia-builder.html';
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      loadUserApps();

      const backBtn = document.getElementById('backBtn');
      const createBtn = document.getElementById('createBtn');
      
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          window.location.href = 'index.html';
        });
      }
      
      if (createBtn) {
        createBtn.addEventListener('click', startCreationFlow);
      }
    });
  </script>
</body>
</html>
