<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>
  <script src="js/config.js?v=8.0"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #loading {
      text-align: center;
      color: #00ff88;
    }

    #chat-container {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      background: #0d0d0d;
      display: none;
      flex-direction: column;
    }

    .chat-header {
      padding: 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00ff88;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      overflow: hidden;
      flex-shrink: 0;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-header-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-subtitle {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message-bot {
      align-self: flex-start;
      background: #00ff88;
      color: #000;
      border-bottom-left-radius: 4px;
    }

    .message-user {
      align-self: flex-end;
      background: #333333;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-input {
      padding: 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 12px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
    }

    .chat-input input:focus {
      outline: none;
      border-color: #00ff88;
    }

    .chat-input button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #00ff88;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: #000;
    }

    .chat-input button:hover {
      background: #00cc6a;
    }

    /* Tema claro */
    .theme-light {
      background: #f5f5f5;
    }

    .theme-light .chat-header {
      background: #fff;
      border-color: #ddd;
    }

    .theme-light .chat-header-name {
      color: #000;
    }

    .theme-light .chat-header-subtitle {
      color: #666;
    }

    .theme-light .chat-input {
      background: #fff;
      border-color: #ddd;
    }

    .theme-light .chat-input input {
      background: #f5f5f5;
      border-color: #ddd;
      color: #000;
    }

    @media (max-width: 768px) {
      #chat-container {
        max-width: 100%;
        height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <p>Cargando chat...</p>
  </div>
  <div id="chat-container">
    <div class="chat-header">
      <div class="chat-avatar" id="chatAvatar">
        🤖
      </div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chatBotName">Asistente</div>
        <div class="chat-header-subtitle" id="chatSubtitle">Mi Empresa</div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message message-bot" id="welcomeMessage">
        ¡Hola! ¿En qué puedo ayudarte hoy?
      </div>
    </div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje...">
      <button id="sendButton">➤</button>
    </div>
  </div>

  <script>
    async function loadChat() {
      // Obtener slug de la URL
      const path = window.location.pathname;
      const slug = path.replace('/', '').replace('/myia-', '');
      
      console.log('Slug:', slug);
      
      if (!slug) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`https://crysantem-backend.onrender.com/api/myia/config-by-slug/${slug}`);
        const result = await response.json();

        if (result.success && result.data) {
          const config = result.data;
          
          // Ocultar loading
          document.getElementById('loading').style.display = 'none';
          document.getElementById('chat-container').style.display = 'flex';
          
          // Aplicar configuración
          document.title = config.business_name || 'MyIA Chat';
          
          // Nombre del bot
          document.getElementById('chatBotName').textContent = config.bot_name || 'Asistente';
          
          // Subtítulo
          document.getElementById('chatSubtitle').textContent = config.header_subtitle || '';
          
          // Avatar
          const avatarContainer = document.getElementById('chatAvatar');
          if (config.bot_avatar) {
            avatarContainer.innerHTML = `<img src="${config.bot_avatar}" alt="Bot">`;
          } else {
            avatarContainer.innerHTML = '🤖';
          }
          
          // Fondo
          const chatContainer = document.getElementById('chat-container');
          if (config.background_type === 'solid') {
            chatContainer.style.background = config.background_color || '#0d0d0d';
          } else if (config.background_type === 'gradient') {
            const colors = (config.background_gradient || '#0d0d0d,#1a1a1a').split(',');
            chatContainer.style.background = `linear-gradient(to top, ${colors[0]}, ${colors[1]})`;
          } else if (config.background_type === 'image' && config.background_image) {
            chatContainer.style.background = `url(${config.background_image}) center/cover`;
          }
          
          // Tema
          if (config.chat_theme === 'light') {
            document.getElementById('chat-container').classList.add('theme-light');
          }
          
          // Colores de burbujas
          const botMessages = document.querySelectorAll('.message-bot');
          const userMessages = document.querySelectorAll('.message-user');
          
          botMessages.forEach(msg => {
            msg.style.background = config.message_bubble_color || '#00ff88';
            msg.style.color = getContrastColor(config.message_bubble_color || '#00ff88');
          });
          
          userMessages.forEach(msg => {
            msg.style.background = config.user_bubble_color || '#333333';
            msg.style.color = getContrastColor(config.user_bubble_color || '#333333');
          });
          
          // Mensaje de bienvenida
          if (config.welcome_message) {
            document.getElementById('welcomeMessage').textContent = config.welcome_message;
          }
          
          // Configurar envío de mensajes
          setupMessageSending(config);
        } else {
          document.getElementById('loading').innerHTML = '<p>Chat no encontrado</p>';
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').innerHTML = '<p>Error al cargar el chat</p>';
      }
    }

    function setupMessageSending(config) {
      const input = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const messagesContainer = document.getElementById('chatMessages');
      
      function sendMessage() {
        const message = input.value.trim();
        if (!message) return;
        
        // Agregar mensaje del usuario
        const userMessage = document.createElement('div');
        userMessage.className = 'message message-user';
        userMessage.textContent = message;
        userMessage.style.background = config.user_bubble_color || '#333333';
        userMessage.style.color = getContrastColor(config.user_bubble_color || '#333333');
        messagesContainer.appendChild(userMessage);
        
        // Limpiar input
        input.value = '';
        
        // Scroll al final
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        // Enviar al backend (a implementar)
        sendToBackend(message, config);
      }
      
      sendButton.addEventListener('click', sendMessage);
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    }

    async function sendToBackend(message, config) {
      try {
        const response = await fetch('https://crysantem-backend.onrender.com/api/myia/chat-message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            slug: config.slug,
            message: message
          })
        });
        
        const result = await response.json();
        
        if (result.success && result.response) {
          // Agregar respuesta del bot
          const botMessage = document.createElement('div');
          botMessage.className = 'message message-bot';
          botMessage.textContent = result.response;
          botMessage.style.background = config.message_bubble_color || '#00ff88';
          botMessage.style.color = getContrastColor(config.message_bubble_color || '#00ff88');
          
          const messagesContainer = document.getElementById('chatMessages');
          messagesContainer.appendChild(botMessage);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      } catch (error) {
        console.error('Error al enviar mensaje:', error);
      }
    }

    function getContrastColor(hexColor) {
      const r = parseInt(hexColor.slice(1, 3), 16);
      const g = parseInt(hexColor.slice(3, 5), 16);
      const b = parseInt(hexColor.slice(5, 7), 16);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.5 ? '#000' : '#fff';
    }

    loadChat();
  </script>
</body>
</html>
