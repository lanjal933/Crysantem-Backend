<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Página - MyIA Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6.3">
  <script src="js/config.js?v=6.3"></script>
  <style>
    .editor-container {
      min-height: 100vh;
      background: var(--bg-main);
      padding: 120px 20px 40px;
      position: relative;
    }

    .editor-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .editor-title {
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-main);
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    .editor-subtitle {
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-xl);
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .editor-grid {
        grid-template-columns: 1fr;
      }
    }

    .editor-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-xl);
    }

    .editor-section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: var(--spacing-lg);
      font-family: var(--font-display);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .editor-section-title svg {
      width: 24px;
      height: 24px;
      color: var(--green-main);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: var(--font-body);
      transition: all var(--transition);
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      outline: none;
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
    }

    .form-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-helper {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .btn-save {
      background: var(--green-main);
      color: var(--bg-main);
      padding: 14px 28px;
      border: 1px solid var(--green-main);
      border-radius: var(--border-radius-md);
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
    }

    .btn-save:hover {
      background: var(--green-secondary);
      border-color: var(--green-secondary);
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-secondary);
      padding: 14px 28px;
      border: 1px solid var(--border);
      border-radius: var(--border-radius-md);
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: var(--font-body);
    }

    .btn-cancel:hover {
      border-color: var(--green-main);
      color: var(--green-main);
      background: rgba(0, 255, 136, 0.05);
    }

    .editor-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: var(--spacing-xl);
    }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--green-main);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-state {
      text-align: center;
      padding: 60px 20px;
      color: #ff4444;
    }

    .oauth-credentials {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      border-radius: var(--border-radius-md);
      padding: 16px;
      margin-bottom: var(--spacing-lg);
    }

    .oauth-credentials-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #ff4444;
      margin-bottom: 8px;
    }

    .oauth-credentials-text {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-content">
      <a href="index.html" class="navbar-logo">
        <img src="images/New_Logo_White.png" alt="Crysantem" class="navbar-logo-img">
        <span>CRYSANTEM</span>
      </a>
      <div class="navbar-toggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="navbar-links">
        <a href="#demo" class="navbar-link">Demos</a>
        <a href="#myia" class="navbar-link" style="color: var(--green-main);">MyIA</a>
        <a href="#planes" class="navbar-link">Planes</a>
        <a href="#portfolio" class="navbar-link">Portfolio</a>
        <a href="#nosotros" class="navbar-link">Nosotros</a>
        <a href="#faq" class="navbar-link">FAQ</a>
        <a href="#contacto" class="navbar-link">Contacto</a>
        <div class="navbar-auth">
          <button id="authBtn" class="navbar-auth-btn">Account</button>
          <div id="authDropdown" class="navbar-dropdown">
            <button id="logoutBtn" class="navbar-dropdown-item navbar-dropdown-logout">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="editor-container">
    <div class="container">
      <div class="editor-header">
        <div>
          <h1 class="editor-title">Editar Página</h1>
          <p class="editor-subtitle">Modifica prompt, credenciales OAuth y estética</p>
        </div>
        <button class="btn-cancel" id="backBtn">← Volver al Dashboard</button>
      </div>

      <div id="editorContent">
        <div class="loading-state">
          <div class="loading-spinner"></div>
          <p>Cargando configuración...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Autenticación -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Iniciar Sesión</h3>
        <button class="modal-close" aria-label="Cerrar modal">×</button>
      </div>
      <form id="authForm"></form>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/myia-editor.js?v=6.3"></script>
</body>
</html>
