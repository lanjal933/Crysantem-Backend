<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constructor de Chat - MyIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=8.0">
  <script src="js/config.js?v=8.1"></script>
  <style>
    .builder-container {
      min-height: 100vh;
      background: var(--bg-main);
      padding: 120px 20px 40px;
      position: relative;
    }

    .builder-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 255, 136, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .builder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 1;
    }

    .builder-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      font-family: var(--font-display);
    }

    .builder-content {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    .builder-sidebar {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-lg);
      padding: 24px;
      height: fit-content;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--green-main);
      box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-picker {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: var(--border-radius-md);
      cursor: pointer;
      background: transparent;
    }

    .color-value {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-md);
      color: var(--text-main);
      font-family: monospace;
    }

    .preview-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--border-radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-preview {
      width: 100%;
      max-width: 400px;
      background: #0d0d0d;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .chat-header {
      padding: 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      overflow: hidden;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .chat-header-subtitle {
      font-size: 0.8rem;
      color: #888;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message-bot {
      align-self: flex-start;
      background: var(--message-bubble-color, #00ff88);
      color: #000;
      border-bottom-left-radius: 4px;
    }

    .message-user {
      align-self: flex-end;
      background: var(--user-bubble-color, #333333);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-input {
      padding: 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      gap: 12px;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 24px;
      color: #fff;
      font-size: 0.95rem;
    }

    .chat-input input:focus {
      outline: none;
      border-color: var(--green-main);
    }

    .chat-input button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--green-main);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .builder-content {
        grid-template-columns: 1fr;
      }

      .chat-preview {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="builder-container">
    <div class="builder-header">
      <h1 class="builder-title">Constructor de Chat</h1>
      <div style="display: flex; gap: 12px;">
        <button class="btn-secondary" id="cancelBtn">← Cancelar</button>
        <button class="btn-primary" id="summaryBtn">Siguiente →</button>
      </div>
    </div>

    <div class="builder-content">
      <div class="builder-sidebar">
        <h3 style="margin-bottom: 20px; color: var(--text-main);">Configuración del Chat</h3>

        <div class="form-group">
          <label class="form-label">Nombre del Chat (Business Name)</label>
          <input type="text" id="businessName" class="form-input" placeholder="Mi Negocio">
        </div>

        <div class="form-group">
          <label class="form-label">Slug (URL del chat)</label>
          <input type="text" id="slug" class="form-input" placeholder="mi-chat">
        </div>

        <div class="form-group">
          <label class="form-label">Nombre del Bot</label>
          <input type="text" id="botName" class="form-input" placeholder="Asistente">
        </div>

        <div class="form-group">
          <label class="form-label">Subtítulo del Header (Empresa)</label>
          <input type="text" id="headerSubtitle" class="form-input" placeholder="Nombre de tu empresa">
        </div>

        <div class="form-group">
          <label class="form-label">Avatar del Bot (URL)</label>
          <input type="text" id="botAvatar" class="form-input" placeholder="https://...">
          <input type="file" id="botAvatarFile" accept="image/*" style="margin-top: 8px;">
        </div>

        <div class="form-group">
          <label class="form-label">Tema del Chat</label>
          <select id="chatTheme" class="form-input">
            <option value="dark">Oscuro</option>
            <option value="light">Claro</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Color de Mensajes del Bot</label>
          <div class="color-picker-wrapper">
            <input type="color" id="messageBubbleColor" class="color-picker" value="#00ff88">
            <input type="text" id="messageBubbleColorValue" class="color-value" value="#00ff88">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Color de Mensajes del Usuario</label>
          <div class="color-picker-wrapper">
            <input type="color" id="userBubbleColor" class="color-picker" value="#333333">
            <input type="text" id="userBubbleColorValue" class="color-value" value="#333333">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Tipo de Fondo</label>
          <select id="backgroundType" class="form-input">
            <option value="solid">Color Sólido</option>
            <option value="gradient">Degradado</option>
            <option value="image">Imagen</option>
          </select>
        </div>

        <div class="form-group" id="solidColorGroup">
          <label class="form-label">Color de Fondo</label>
          <div class="color-picker-wrapper">
            <input type="color" id="backgroundColor" class="color-picker" value="#0d0d0d">
            <input type="text" id="backgroundColorValue" class="color-value" value="#0d0d0d">
          </div>
        </div>

        <div class="form-group" id="gradientGroup" style="display: none;">
          <label class="form-label">Degradado (Abajo → Arriba)</label>
          <div class="color-picker-wrapper" style="margin-bottom: 8px;">
            <input type="color" id="gradientStart" class="color-picker" value="#0d0d0d">
            <input type="text" id="gradientStartValue" class="color-value" value="#0d0d0d">
          </div>
          <div class="color-picker-wrapper">
            <input type="color" id="gradientEnd" class="color-picker" value="#1a1a1a">
            <input type="text" id="gradientEndValue" class="color-value" value="#1a1a1a">
          </div>
        </div>

        <div class="form-group" id="imageGroup" style="display: none;">
          <label class="form-label">URL de Imagen de Fondo</label>
          <input type="text" id="backgroundImage" class="form-input" placeholder="https://...">
          <input type="file" id="backgroundImageFile" accept="image/*" style="margin-top: 8px;">
        </div>
      </div>

      <div class="preview-section">
        <h3 style="margin-bottom: 20px; color: var(--text-main);">Vista Previa</h3>
        <div class="chat-preview" id="chatPreview">
          <div class="chat-header">
            <div class="chat-avatar" id="previewAvatar">
              🤖
            </div>
            <div class="chat-header-info">
              <div class="chat-header-name" id="previewBotName">Asistente</div>
              <div class="chat-header-subtitle" id="previewSubtitle">Mi Empresa</div>
            </div>
          </div>
          <div class="chat-messages">
            <div class="message message-bot">
              ¡Hola! ¿En qué puedo ayudarte hoy?
            </div>
            <div class="message message-user">
              Necesito información sobre tus servicios
            </div>
            <div class="message message-bot">
              Claro, con gusto te ayudo. ¿Qué te gustaría saber?
            </div>
          </div>
          <div class="chat-input">
            <input type="text" placeholder="Escribe un mensaje..." disabled>
            <button>➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/myia-builder.js?v=8.1"></script>
</body>
</html>
